apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: devopsbatches.runelock.io
spec:
  group: runelock.io
  names:
    plural: devopsbatches
    singular: devopsbatch
    kind: DevOpsBatch
    shortNames:
      - batches
      - dbat
  scope: Namespaced
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties: 
          spec:
            type: object
            properties:
              name:
                type: string
                description: "Name of Batch"
              duration:
                type: string
              mode:
                type: string
              platform:
                type: string
