apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: runes.runelock.io
spec:
  group: runelock.io
  names:
    plural: runes
    singular: rune
    kind: RuneSecret
    shortNames:
      - rsec
  scope: Namespaced
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              key:
                type: string
                description: "Key of your secret"
              value:
                type: string
                description: "Your actual secret"
              namespace:
                type: string
                description: "Namespace of Secret to store, defaults to 'default' "

